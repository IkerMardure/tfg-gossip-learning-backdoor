run_name: '{timestamp} - neudet - fc_8'
topology: 'conf/topologies/analysis'
device: cuda
early_local_train: False
num_rounds: 240
# num_clients_per_round_fit: 2 #Doesn't matter - controlled by topology
# num_clients_per_round_eval: 2 #Doesn't matter - controlled by topology
batch_size: 128
num_classes: 10 # Auto-adjusted for the built-in dataset selection
balance_data: False
seed: 2001

# dataset options: 'cifar', 'mnist', or 'neu_det'
dataset: neu_det
# data_path used by torchvision datasets (if non-default)
# MNIST/CIFAR/NEU-DET use the shared datasets root in data/datasets.
data_path: "data/datasets"

simulation:
  # Lower CPU per client to increase Ray concurrency.
  num_cpus_per_client: 2
  # "auto" keeps current heuristic based on topology/concurrent clients.
  # Set a float (for example 0.25) to force a fixed GPU fraction per client.
  num_gpus_per_client: "auto"

config_fit:
  lr: 0.0001
  momentum: 0.9 # Momentum is commonly used with SGD to accelerate convergence and improve training stability. A value of 0.9 is a common default that provides a good balance between speed and stability for many tasks, including image classification with CNNs. It helps the optimizer build up speed in directions with consistent gradients while dampening oscillations in directions with noisy gradients, which can lead to faster convergence and better final accuracy.
  local_epochs: 2
  enable_tqdm: false
  # Backdoor simulation controls for the adaptive attacker.
  # Round numbers start at 1, so 4 means "benign for rounds 1-3, active from round 4".
  attacker_activation_round: 64
  attacker_lr: 0.0001
  attacker_lr_decay: 0.99 # Decay factor per round after activation (0.95 means 5% decay each round)
  attacker_lr_min: 0.0001
  attacker_batch_mixing: true
  attacker_freeze_conv_layers: false # If true, attacker only trains the fully connected layers, keeping conv layers fixed (recommended for stronger backdoor)

pretraining:
  enabled: true
  epochs: 20
  lr: 0.0001
  save_path:
  enable_tqdm: false
  # Mix pretrained parameters with random initialization (0.0-1.0)
  # 1.0 = full pretrained (current behavior, strong initial acc ~0.89)
  # 0.5 = 50/50 blend (recommended to target ~0.7 initial acc)
  # 0.0 = fully random (no pretraining benefit)
  mix_alpha: 1
  # Optional: add Gaussian noise to pretrained parameters (std dev)
  # 0.0 = no noise, 0.01-0.05 = mild degradation
  noise_std: 0.0

# Logging configuration
# Set verbose_logging to "minimal", "standard", or "verbose"
# "minimal" - only final results, no per-round messages
# "standard" - key milestones only (pretraining start/end, round heartbeats)
# "verbose" - detailed per-client info during training
verbose_logging: "verbose"

# Per-component overrides (optional, uncomment to override)
# log_level_client_training: "minimal"
# log_level_data_poisoning: "minimal"
# log_level_pretraining: "standard"
# log_level_results: "standard"
# log_level_heartbeat: "standard"

